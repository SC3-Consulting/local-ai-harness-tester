name: Python quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m isort --check-only harness_tester.py evaluations.py hardware.py web_ui.py runtime_adapters.py auto_tuner.py tests examples
      - run: python -m black --check harness_tester.py evaluations.py hardware.py web_ui.py runtime_adapters.py auto_tuner.py tests examples
      - run: python -m pylint harness_tester.py evaluations.py hardware.py web_ui.py runtime_adapters.py auto_tuner.py
      - run: python -m mypy
      - run: python -m pytest -q
